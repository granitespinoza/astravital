# AI assistance: Anthropic Claude. Build and run the automated tests on every push and pull request.
name: CI
on:
  push:
    branches: [main, chore/hackathon-coherence]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test
      - run: node tests/e2e-web.mjs
      - run: node tests/e2e-local.mjs
